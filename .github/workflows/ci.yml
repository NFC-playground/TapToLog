# Runs the TapLog unit tests on a GitHub-hosted Mac for every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# If you push again while a run is in progress, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create placeholder Secrets.swift
        run: |
          mkdir -p TapLog/Configuration
          cat > TapLog/Configuration/Secrets.swift << 'EOF'
          enum Secrets {
              static let supabaseURL = "https://placeholder.supabase.co"
              static let supabaseKey = "placeholder-key"
          }
          EOF

      # Reuse downloaded Swift packages (Supabase) between runs.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project TapLog.xcodeproj \
            -scheme TapLog \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:TapLogTests \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO
