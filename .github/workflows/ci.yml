# Runs the TapLog unit tests on a GitHub-hosted Mac for every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project TapLog.xcodeproj \
            -scheme TapLog \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:TapLogTests \
            CODE_SIGNING_ALLOWED=NO
